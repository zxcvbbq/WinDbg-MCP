[package]
name = "windbg-mcp"
version = "0.1.3"
edition = "2024"
description = "A structured Model Context Protocol server for the Windows Debugger Engine"
license = "MIT"

[dependencies]
anyhow = "1.0"
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.26", features = ["v4"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug_Extensions",
    "Win32_System_LibraryLoader",
] }
windows-core = "0.62.2"

[profile.release]
lto = "thin"
strip = "symbols"
